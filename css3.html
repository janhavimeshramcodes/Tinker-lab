<!DOCTYPE html>
<html>
<head>
<title>Internal CSS</title>
<style>
.container {
           display:flex;
           flex-wrap:wrap;  
           display:grid;
           grid-template-columns:2fr 2fr 1fr;
           }
.box {
     Background-color:LightBlue;
     padding:20px;
     width:200px;
     margin:30px;
     }
H2{ color:red; }
</style>
</head>
<Body>
<div class="container">
<div class="box" style = "background-color:lightyellow;">
HTML
</div>
<div class="box" style = "background-color:lightgreen;">
Internal
</div>
<div class="box" style = "background-color:lavender;">
External
</div>
<div class="box" style = background-color:skyblue;">
Inline
</div>
<div class="box" style = background-color:lightpink>
CSS
</div>
</body>
</html>
